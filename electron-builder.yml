appId: com.aioversight.app
productName: AI Oversight
# Space-free artifact names. GitHub renames uploaded assets whose names
# contain spaces (spaces become dots), which would break the file URLs that
# latest*.yml points electron-updater at. Keep these in sync with
# `assetMatchesTarget` in src/main/updater.ts.
artifactName: ${name}-${version}-${os}-${arch}.${ext}
# Generates latest.yml / latest-linux.yml / latest-mac.yml next to the
# artifacts and bakes app-update.yml into resources/. The package scripts
# still pass `--publish never`: CI uploads the files with
# softprops/action-gh-release (see .github/workflows/release.yml).
publish:
  provider: github
  owner: nikolmedo
  repo: AIOversight
directories:
  output: release
  buildResources: assets
files:
  - dist/**/*
  - assets/**/*
  - package.json
  - node_modules/sql.js/**/*
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - "!**/node_modules/*.d.ts"
  - "!**/node_modules/.bin"
extraMetadata:
  main: dist/main/index.js
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  icon: assets/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: assets/icon.png
nsis:
  artifactName: ${name}-${version}-setup-${arch}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
portable:
  artifactName: ${name}-${version}-portable-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
    - tar.gz
  category: Development
  icon: assets/icon.png

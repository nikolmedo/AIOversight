<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; img-src 'self' data:;" />
  <title>AI Oversight</title>
  <link rel="stylesheet" href="tray-popup.css" />
</head>
<body>
  <header class="popup-header">
    <img class="logo" src="assets/ai-icon.png" alt="" />
    <h1>AI Oversight</h1>
    <button type="button" id="openSettingsHeader" class="icon-btn" aria-label="Open settings" title="Settings">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h7M12 4h2M2 12h2M7 12h7"/><circle cx="10.5" cy="4" r="1.5"/><circle cx="5.5" cy="12" r="1.5"/></svg>
    </button>
  </header>
  <main id="scroller">
    <div id="totalSpendCard"></div>
    <div id="content">
      <p class="empty">Loading…</p>
    </div>
  </main>
  <footer class="popup-footer">
    <button type="button" id="refreshAll" class="btn btn-ghost" aria-label="Refresh quotas">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.55M13 2.5v2.5h-2.5"/></svg>
      Refresh
    </button>
    <span id="refreshTimer" class="refresh-timer" aria-live="polite"></span>
    <button type="button" id="openSettings" class="btn btn-secondary">Settings</button>
  </footer>
  <script src="quota-math.js"></script>
  <script src="quota-view.js"></script>
  <script src="tray-popup.js"></script>
</body>
</html>

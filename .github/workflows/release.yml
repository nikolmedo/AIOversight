name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build_and_release:
    name: Build and Release for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform's upload flaking must not cancel the other two builds.
      fail-fast: false
      matrix:
        include:
          # latest*.yml and *.blockmap are the auto-update metadata
          # electron-updater downloads; a release without them makes update
          # checks fail for that platform. The macOS zip is what MacUpdater
          # installs from, so it ships alongside the dmg. A single `--mac`
          # run builds x64 and arm64 and writes one latest-mac.yml for both.
          - os: macos-latest
            build_script: npm run package:mac
            artifact_path: |
              release/*.dmg
              release/*.zip
              release/*.blockmap
              release/latest-mac.yml
          - os: windows-latest
            build_script: npm run package:win
            artifact_path: |
              release/*.exe
              release/*.blockmap
              release/latest.yml
          - os: ubuntu-latest
            build_script: npm run package:linux
            artifact_path: |
              release/*.deb
              release/*.tar.gz
              release/*.AppImage
              release/*.blockmap
              release/latest-linux*.yml

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Package Application
        run: ${{ matrix.build_script }}

      # GitHub's release asset endpoint returns intermittent 500s ("Error
      # saving asset", "Error creating asset temp dir") unrelated to file size,
      # upload order or platform. A rejected upload still registers the asset
      # in `starter` state, so every attempt needs --clobber to replace it.
      # softprops/action-gh-release rethrows 5xx without retrying, which turned
      # a single flaky request into a failed release, so the retry lives here.
      - name: Upload Binaries to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          ARTIFACT_PATHS: ${{ matrix.artifact_path }}
        run: |
          set -euo pipefail
          # A glob matching nothing means the build did not produce a file this
          # release needs. Fail loudly instead of publishing a release with
          # missing auto-update metadata.
          shopt -s failglob
          files=( $ARTIFACT_PATHS )

          # Whichever platform job arrives first creates the release; the
          # trailing view turns the resulting race into success.
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --title "$TAG" --notes "" \
            || gh release view "$TAG" >/dev/null

          failed=""
          for file in "${files[@]}"; do
            uploaded=""
            for attempt in 1 2 3 4 5; do
              if gh release upload "$TAG" "$file" --clobber; then
                uploaded="yes"
                break
              fi
              echo "attempt $attempt failed for $file"
              if [ "$attempt" -lt 5 ]; then
                sleep $(( attempt * 15 ))
              fi
            done
            if [ -z "$uploaded" ]; then
              failed="$failed $file"
            fi
          done

          if [ -n "$failed" ]; then
            echo "::error::gave up uploading:$failed"
            exit 1
          fi

          # An upload can report success and still leave the asset in `starter`
          # state, which is listed but not downloadable. A green step is not
          # proof, so check the published state of every file.
          assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq '.assets[] | .name + "=" + .state')
          incomplete=0
          for file in "${files[@]}"; do
            name=$(basename "$file")
            state=$(printf '%s\n' "$assets" | sed -n "s/^${name}=//p")
            if [ "$state" != "uploaded" ]; then
              echo "::error::$name is '${state:-missing}', expected 'uploaded'"
              incomplete=1
            fi
          done
          exit "$incomplete"

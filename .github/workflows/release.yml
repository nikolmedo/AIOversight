name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build_and_release:
    name: Build and Release for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # latest*.yml and *.blockmap are the auto-update metadata
          # electron-updater downloads; a release without them makes update
          # checks fail for that platform. The macOS zip is what MacUpdater
          # installs from, so it ships alongside the dmg. A single `--mac`
          # run builds x64 and arm64 and writes one latest-mac.yml for both.
          - os: macos-latest
            build_script: npm run package:mac
            artifact_path: |
              release/*.dmg
              release/*.zip
              release/*.blockmap
              release/latest-mac.yml
          - os: windows-latest
            build_script: npm run package:win
            artifact_path: |
              release/*.exe
              release/*.blockmap
              release/latest.yml
          - os: ubuntu-latest
            build_script: npm run package:linux
            artifact_path: |
              release/*.deb
              release/*.tar.gz
              release/*.AppImage
              release/*.blockmap
              release/latest-linux*.yml

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Package Application
        run: ${{ matrix.build_script }}

      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_path }}
          # Upload one asset at a time. The macOS job ships ~500 MB across two
          # dmgs and two zips; uploading those in parallel made GitHub's asset
          # API return a 500 and left assets stuck in `starter` state.
          preserve_order: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

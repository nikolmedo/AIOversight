name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # The release is created as a draft here, by a single job, and published only
  # after every platform has uploaded. Two reasons. A published release with
  # part of its assets is what electron-updater clients resolve to, and they
  # then fail on the missing latest*.yml. And three matrix jobs racing to
  # create it would produce duplicate drafts, because GitHub enforces tag
  # uniqueness only for published releases.
  prepare_release:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists, reusing it"
          else
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes ""
          fi

  build_and_release:
    name: Build and Release for ${{ matrix.os }}
    needs: prepare_release
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform's upload flaking must not cancel the other two builds.
      fail-fast: false
      matrix:
        include:
          # latest*.yml and *.blockmap are the auto-update metadata
          # electron-updater downloads; a release without them makes update
          # checks fail for that platform. The macOS zip is what MacUpdater
          # installs from, so it ships alongside the dmg. A single `--mac`
          # run builds x64 and arm64 and writes one latest-mac.yml for both.
          - os: macos-latest
            build_script: npm run package:mac
            artifact_path: |
              release/*.dmg
              release/*.zip
              release/*.blockmap
              release/latest-mac.yml
          - os: windows-latest
            build_script: npm run package:win
            artifact_path: |
              release/*.exe
              release/*.blockmap
              release/latest.yml
          # No *.blockmap here: electron-builder writes the AppImage's block
          # map inside the AppImage itself (latest-linux.yml carries its
          # blockMapSize), so Linux produces no standalone blockmap file.
          - os: ubuntu-latest
            build_script: npm run package:linux
            artifact_path: |
              release/*.deb
              release/*.tar.gz
              release/*.AppImage
              release/latest-linux*.yml

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Package Application
        run: ${{ matrix.build_script }}

      # GitHub's release asset endpoint returns intermittent 500s ("Error
      # saving asset", "Error creating asset temp dir") unrelated to file size,
      # upload order or platform; on 2026-09-17 it failed roughly half of all
      # requests for several hours. A rejected upload still registers the asset
      # in `starter` state, so a plain retry would collide with it and every
      # attempt needs --clobber. softprops/action-gh-release rethrows 5xx
      # without retrying, which is why one flaky request failed whole releases.
      - name: Upload Binaries to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          ARTIFACT_PATHS: ${{ matrix.artifact_path }}
        run: |
          set -euo pipefail
          # A glob matching nothing means the build did not produce a file this
          # release needs. Fail loudly instead of publishing a release with
          # missing auto-update metadata.
          shopt -s failglob
          files=( $ARTIFACT_PATHS )

          failed=""
          for file in "${files[@]}"; do
            uploaded=""
            for attempt in 1 2 3 4 5 6; do
              if gh release upload "$TAG" "$file" --clobber; then
                uploaded="yes"
                break
              fi
              echo "attempt $attempt failed for $file"
              if [ "$attempt" -lt 6 ]; then
                sleep $(( attempt * 20 ))
              fi
            done
            if [ -z "$uploaded" ]; then
              failed="$failed $file"
            fi
          done

          if [ -n "$failed" ]; then
            echo "::error::gave up uploading:$failed"
            exit 1
          fi

          # An upload can report success and still leave the asset in `starter`
          # state, which is listed but not downloadable. A green step is not
          # proof, so check the published state of every file.
          assets=$(gh release view "$TAG" --json assets)
          incomplete=0
          for file in "${files[@]}"; do
            name=$(basename "$file")
            state=$(NAME="$name" node -e '
              const a = JSON.parse(require("fs").readFileSync(0, "utf8")).assets;
              const hit = a.find(x => x.name === process.env.NAME);
              process.stdout.write(hit ? hit.state : "missing");
            ' <<< "$assets")
            if [ "$state" != "uploaded" ]; then
              echo "::error::$name is '$state', expected 'uploaded'"
              incomplete=1
            fi
          done
          exit "$incomplete"

  # Runs only if all three platform jobs succeeded, so a partially uploaded
  # release stays a draft and never reaches electron-updater clients.
  publish_release:
    name: Publish release
    needs: build_and_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify assets and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          assets=$(gh release view "$TAG" --json assets)

          # Every asset must be downloadable, and each platform needs its
          # manifest or update checks there fail silently.
          problems=$(node -e '
            const { assets } = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const out = [];
            for (const a of assets) {
              if (a.state !== "uploaded") out.push(`${a.name} is '"'"'${a.state}'"'"', expected '"'"'uploaded'"'"'`);
            }
            for (const m of ["latest.yml", "latest-mac.yml", "latest-linux.yml"]) {
              if (!assets.some(a => a.name === m)) out.push(`${m} is missing from the release`);
            }
            process.stdout.write(out.join(String.fromCharCode(10)));
          ' <<< "$assets")

          if [ -n "$problems" ]; then
            while IFS= read -r problem; do
              echo "::error::$problem"
            done <<< "$problems"
            exit 1
          fi

          gh release edit "$TAG" --draft=false --latest
          echo "published $TAG"
